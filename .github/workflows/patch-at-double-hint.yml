name: Patch AT double hint

on:
  push:
    paths:
      - '.github/workflows/patch-at-double-hint.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch AT hint target
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('game.js')
          s = p.read_text(encoding='utf-8')
          old = "return weightedPick(atHitRate >= .80 ? pool80 : pool60);"
          new = "return weightedPick(atDoubleRate >= .80 ? pool80 : pool60);"
          assert old in s, 'AT hint target not found'
          s = s.replace(old, new, 1)

          old = "hintSub.textContent = `${currentHint.sub} 60%AT / 80%ATのどちらかを推測する示唆です。`;"
          new = "hintSub.textContent = `${currentHint.sub} AT中のダブルアップ成功率が60% / 80%のどちらかを推測する示唆です。`;"
          assert old in s, 'AT hint description not found'
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '・AT中：ATくじの当選率が60% / 80%のどちら寄りかをぼかして示唆。'
          new = '・AT中：固定されたダブルアップ成功率が60% / 80%のどちら寄りかをぼかして示唆。'
          assert old in s, 'rules text not found'
          s = s.replace(old, new, 1)
          s = s.replace('game.js?v=16', 'game.js?v=18', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js index.html
          git commit -m "Use AT double-up rate for AT hints"
          git push
