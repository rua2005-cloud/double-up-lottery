name: Patch equal AT chance v24

on:
  push:
    paths:
      - '.github/workflows/patch-equal-at-chance-v24.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Equalize AT entry chance across prize amounts
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('game-v20.js')
          s = p.read_text(encoding='utf-8')
          old = """  function shouldEnterAT(prize) {\n    if (atActive || prize === 0) return false;\n    let p = hiddenMode === 'cold' ? .05 : .10;\n    // 100回消化後（101回目以降）はAT突入率を一律+5pt。\n    if (drawsLeft < 50) p += .05;\n    if (prize >= 500) p += .08;\n    if (prize >= 1000) p += .08;\n    return Math.random() < p;\n  }"""
          new = """  function shouldEnterAT(prize) {\n    if (atActive || prize === 0) return false;\n    // 当選額による差はなし。100/200/500/1000すべて同じAT突入率。\n    let p = hiddenMode === 'cold' ? .05 : .10;\n    // 100回消化後（101回目以降）はAT突入率を一律+5pt。\n    if (drawsLeft < 50) p += .05;\n    return Math.random() < p;\n  }"""
          assert old in s, 'shouldEnterAT block not found'
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '・100回消化後（101回目以降）は、AT突入率が通常より5ポイント上昇します。<br>'
          new = '・100 / 200 / 500 / 1000コインのどれが当たっても、AT突入率は同じです。<br>\n    ・100回消化後（101回目以降）は、AT突入率が通常より5ポイント上昇します。<br>'
          assert old in s, 'AT rule line not found'
          s = s.replace(old, new, 1)
          s = s.replace('game-v20.js?v=23', 'game-v20.js?v=24', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game-v20.js index.html
          git commit -m "Equalize AT entry chance across prizes"
          git push
