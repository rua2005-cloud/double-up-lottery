name: Patch end button

on:
  push:
    paths:
      - '.github/workflows/patch-end-button.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace reset with finish button
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('game-v20.js')
          s = p.read_text(encoding='utf-8')

          old = "    const usedAll = drawsLeft <= 0;\n    const why = reason || (usedAll ? '150回のくじが終了。' : '所持コインが100未満になり終了。');"
          new = "    const usedAll = drawsLeft <= 0;\n    const manual = reason === '途中終了。';\n    const why = reason || (usedAll ? '150回のくじが終了。' : '所持コインが100未満になり終了。');"
          assert old in s, 'finishGame header not found'
          s = s.replace(old, new, 1)

          old = "    showOverlay('good', usedAll ? '150 DRAWS FINISH' : 'COIN OUT', `${why}\\n最終総コイン：${fmt(score)}\\n初期5,000から：${delta}`, `SCORE ${fmt(score)}`);"
          new = "    showOverlay('good', usedAll ? '150 DRAWS FINISH' : manual ? 'GAME FINISH' : 'COIN OUT', `${why}\\n最終総コイン：${fmt(score)}\\n初期5,000から：${delta}`, `SCORE ${fmt(score)}`);"
          assert old in s, 'finishGame overlay not found'
          s = s.replace(old, new, 1)

          start = s.index('  function resetGame() {')
          end = s.index("\n\n  drawBtn.addEventListener", start)
          replacement = "  function endGameFromButton() {\n    if (gameOver || locked) return;\n    finishGame('途中終了。');\n  }"
          s = s[:start] + replacement + s[end:]

          old = "  resetBtn.addEventListener('click', resetGame);"
          new = "  resetBtn.addEventListener('click', endGameFromButton);"
          assert old in s, 'reset listener not found'
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<button class="reset mobile-reset" id="resetBtn">リセット</button>', '<button class="reset mobile-reset" id="resetBtn">終了</button>', 1)
          rule = '・スコアは終了時の「所持コイン＋未受取賞金」。<br>'
          new_rule = rule + '\n    ・「終了」ボタンを押すと、途中でもその時点の最終スコアを表示します。<br>'
          assert rule in s, 'rules score line not found'
          s = s.replace(rule, new_rule, 1)
          s = s.replace('game-v20.js?v=20', 'game-v20.js?v=21', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game-v20.js index.html
          git commit -m "Replace reset with finish score button"
          git push
